name: catalog-parser

networks:
  parser-api:

volumes:
  redis_data:
  hf_models:

services:
  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - parser-api

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    volumes:
      - hf_models:/root/.cache/huggingface
      - ../data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    gpus: all
    networks:
      - parser-api

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command:
      [
        "uv",
        "run",
        "celery",
        "-A",
        "src.infrastructure.queue.celery_app",
        "worker",
        "--loglevel=info",
        "-Q",
        "catalog",
        "-c",
        "1",
      ]
    env_file:
      - ../.env
    volumes:
      - hf_models:/root/.cache/huggingface
      - ../data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    gpus: all
    networks:
      - parser-api
