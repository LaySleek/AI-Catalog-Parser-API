name: catalog-parser

networks:
  parser-api:

volumes:
  redis_data:
  hf_models:

services:
  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - parser-api

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - parser-api

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command:
      [
        "uv",
        "run",
        "celery",
        "-A",
        "src.infrastructure.queue.celery_app",
        "worker",
        "--loglevel=info",
        "-Q",
        "catalog",
        "-c",
        "1",
      ]
    env_file:
      - ../.env
    volumes:
      - hf_models:/root/.cache/huggingface
      - ../data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      vllm:
        condition: service_healthy
    gpus: all
    networks:
      - parser-api

  vllm:
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    ipc: host
    privileged: true
    gpus: all
    volumes:
      - hf_models:/root/.cache/huggingface
    networks:
      - parser-api
    command:
      - numind/NuExtract3
      - --trust-remote-code
      - --tensor-parallel-size
      - "1"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --reasoning-parser
      - qwen3
      - --speculative-config
      - '{"method": "mtp", "num_speculative_tokens": 2}'
      - --limit-mm-per-prompt
      - '{"video": 0}'
      - --generation-config
      - vllm
      - --chat-template-content-format
      - openai
      - --gpu-memory-utilization
      - "0.9"
      - --max-model-len
      - "32768"
      - --max_num_seqs
      - "170"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 600s
