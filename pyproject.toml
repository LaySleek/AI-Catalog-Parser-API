[project]
name = "ai-catalog-parser"
version = "0.1.0"
description = "AI tool for parsing products from catalogs and for automatically filling out the nomenclature."
authors = [
    { name = "LaySleek", email = "aleisle@mail.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.13.0",
    "celery[redis]>=5.6.3",
    "fastapi>=0.115.0",
    "hf>=1.17.0",
    "opencv-python>=4.13.0.92",
    "openpyxl>=3.1.5",
    "pillow>=11.0.0",
    "pydantic-settings>=2.7.0",
    "pymupdf>=1.27.2.3",
    "python-multipart>=0.0.32",
    "scipy>=1.17.1",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
    "transformers>=5.9.0",
    "uvicorn>=0.34.0",
]
